name: Bug report
description: Report a reproducible builder or launcher problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload ROMs, ROM-derived caches, or copyrighted game assets.

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Red
        - Blue
        - Yellow
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the builder/launcher error text.
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
